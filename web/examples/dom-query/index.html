<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>DOM query benchmark</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div id="nav"></div>

  <form>
    <p>
      Insert <input data-param="numElements" data-default="10000"></input> elements into the DOM, then query
      them individually and in bulk <input data-param="iters" data-default="50"></input> times.
    </p>
    <input type="submit" value="Reload">
    <button id="benchmark">Benchmark</button>
    <button id="reset">Reset Params</button>
  </form>

  <script type="module" src="./main.js"></script>
</body>

</html>
