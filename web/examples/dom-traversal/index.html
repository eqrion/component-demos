<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>DOM traversal benchmark</title>
  <link rel="stylesheet" href="../../style.css">
</head>

<body>
  <div id="nav"></div>

  <form>
    <p>
      Build a DOM tree of depth
      <input data-param="depth" data-default="8"></input> with
      <input data-param="numChildren" data-default="5"></input> children per node,
      then walk it.
    </p>
    <input type="submit" value="Reload">
    <button id="benchmark">Benchmark</button>
    <button id="reset">Reset Params</button>
  </form>

  <script type="module" src="./main.js"></script>
</body>

</html>
