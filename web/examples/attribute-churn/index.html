<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Attribute churn benchmark</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div id="nav"></div>

  <form>
    <p>
      Call <code>setAttribute</code> 4 *
      <input data-param="iters" data-default="20"></input> times
      on <input data-param="elements" data-default="2000"></input> elements.
    </p>
    <input type="submit" value="Reload">
    <button id="benchmark">Benchmark</button>
    <button id="reset">Reset Params</button>
  </form>

  <script type="module" src="./main.js"></script>
</body>

</html>
