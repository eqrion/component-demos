[package]
name = "table-update-wasm-bindgen"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Performance",
  "PerformanceMark",
  "PerformanceMeasure",
  "Window",
] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
strip = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
